model:
  k: 20
features:
  mode: xyz_h_n
  normal_k: 20
  use_file_normals: true
inference:
  device: auto
  num_points: 4096
  extra_passes: 3
  batch_size: 8
  seed: 42
height:
  pot_height_cm: 14.7
  pot_percentile: 99.0
  plant_percentile: 100.0
  strict_pot_percentile: 95.0
  dbscan:
    enabled: true
    eps_m: 0.02
    min_samples: 10
    min_cluster_size: 100
    map_radius_factor: 3.0
    max_fit_points: 50000
  min_class_points: 50
tillers:
  cell_size_m: 0.008
  sigma_cells: 1.0
  window: 3
  min_height_ratio: 0.25
evaluation:
  n_bootstrap: 10000
  bootstrap_seed: 0
training:
  num_points: 4096
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  epochs: 150
  patience: 20
  lopo_epochs: 60
  lopo_patience: 10
  seed: 42
  num_workers: 2
