[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-tiller-pipeline"
version = "0.1.0"
description = "DGCNN-based 3D rice segmentation and phenotyping pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "open3d>=0.18",
  "pandas>=2.1",
  "plyfile>=1.0",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
e57 = ["pye57>=0.4.19"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
rice-tiller = "rice_tiller.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

