[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ricest25"
version = "1.0.0"
description = "RiceST25-3D: DGCNN plant-pot segmentation and plant height / tiller extraction from handheld 3D scans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "plyfile>=1.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.optional-dependencies]
open3d = ["open3d>=0.18"]   # normals exactly as in the research notebook (NumPy fallback otherwise)
e57 = ["pye57>=0.4.19"]     # read raw .e57 exports
dev = ["pytest>=8.0"]

[project.scripts]
ricest25 = "ricest25.cli:main"

[tool.setuptools]
packages = ["ricest25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
