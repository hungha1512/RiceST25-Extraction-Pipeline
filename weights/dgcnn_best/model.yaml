schema_version: 1
architecture: dgcnn
checkpoint_file: dg_best.pth

input:
  mode: xyz_h_n
  channels: 7
  num_points: 4096
  normal_k: 20
  normalization: centroid_max_radius

model:
  k: 20
  num_classes: 2
  class_names:
    0: pot
    1: plant

output:
  type: log_softmax

training_provenance:
  source: code-segment-3d-rice-pheno.ipynb
  note: Default contract matches the notebook DGCNN training cell.

